<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Side A</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@400;500;600&family=Young+Serif&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#E6ECF1; --surface:#F7F9FB; --ink:#17203A; --ink-2:#56617A; --line:#C8D1DB;
  --sun:#E7B13A; --sun-soft:rgba(231,177,58,.22); --sun-ink:#3A2A05;
  --lift:0 1px 0 rgba(23,32,58,.06),0 14px 26px -14px rgba(23,32,58,.45);
  --serif:"Young Serif",Georgia,"Times New Roman",serif;
  --sans:"Familjen Grotesk",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#0F1628; --surface:#18213A; --ink:#E7ECF3; --ink-2:#98A3BA; --line:#2B3654;
    --sun:#F1C453; --sun-soft:rgba(241,196,83,.18); --sun-ink:#2A1E02;
    --lift:0 16px 30px -16px rgba(0,0,0,.85);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0F1628; --surface:#18213A; --ink:#E7ECF3; --ink-2:#98A3BA; --line:#2B3654;
  --sun:#F1C453; --sun-soft:rgba(241,196,83,.18); --sun-ink:#2A1E02;
  --lift:0 16px 30px -16px rgba(0,0,0,.85);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--paper);color:var(--ink);font:400 16px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
img,svg{max-width:100%}
a{color:inherit}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--sun);outline-offset:3px;border-radius:4px}

.top{display:flex;align-items:baseline;justify-content:space-between;gap:1rem;flex-wrap:wrap;max-width:1080px;margin:0 auto;padding:1rem 1.25rem .5rem}
.brand{font-family:var(--serif);font-size:1.35rem;text-decoration:none;letter-spacing:-.01em}
.nav{display:flex;gap:.25rem;flex-wrap:wrap}
.nav a{text-decoration:none;color:var(--ink-2);padding:.35rem .7rem;border-radius:999px;font-weight:500;font-size:.95rem}
.nav a[aria-current="page"]{color:var(--ink);background:var(--surface);box-shadow:inset 0 0 0 1px var(--line)}

main{max-width:1080px;margin:0 auto;padding:0 1.25rem 2rem}

/* Morning */
.hello{padding:1.5rem 0 1rem;max-width:40rem}
.hello h1{font-family:var(--serif);font-weight:400;font-size:clamp(2.4rem,7vw,3.8rem);line-height:1.02;letter-spacing:-.02em;margin:0}
.hello .date{color:var(--ink-2);margin:.4rem 0 0}
.round-line{display:flex;align-items:baseline;gap:.75rem;flex-wrap:wrap;margin:.75rem 0 .25rem}
.round-line strong{font-weight:600}
.round-line span{color:var(--ink-2)}
.reading{margin:0;color:var(--ink);font-size:1.05rem;max-width:40rem}

.table{list-style:none;margin:1.5rem 0 1rem;padding:1.25rem .25rem .5rem;display:grid;grid-template-columns:repeat(6,1fr);gap:1.4rem .9rem}
.sleeve{grid-column:span 2;display:flex;flex-direction:column;min-width:0}
.sleeve:nth-child(4){grid-column:2 / span 2}
.sleeve:nth-child(5){grid-column:4 / span 2}
@media (min-width:760px){
  .table{grid-template-columns:repeat(5,1fr);gap:1.5rem 1.4rem}
  .sleeve,.sleeve:nth-child(4),.sleeve:nth-child(5){grid-column:auto}
}
.sleeve-art{position:relative;display:block;padding:0;border:0;background:none;cursor:pointer;aspect-ratio:1;border-radius:3px;transform:rotate(var(--tilt));box-shadow:var(--lift);transition:transform .28s cubic-bezier(.2,.8,.3,1.2),box-shadow .2s}
.sleeve-art svg{display:block;width:100%;height:100%;border-radius:3px}
.sleeve-art::after{content:"";position:absolute;inset:0;border-radius:3px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}
.sleeve.is-picked .sleeve-art{transform:rotate(0) translateY(-10px) scale(1.03);box-shadow:0 0 0 3px var(--sun),var(--lift)}
.check{position:absolute;right:-.55rem;top:-.55rem;width:1.8rem;height:1.8rem;border-radius:50%;background:var(--sun);color:var(--sun-ink);display:grid;place-items:center;font-weight:600;transform:scale(0);transition:transform .2s}
.sleeve.is-picked .check{transform:scale(1)}
.sleeve-meta{margin-top:.7rem;min-width:0}
.sleeve-meta .t{margin:0;font-weight:600;font-size:.95rem;line-height:1.25;overflow-wrap:anywhere}
.sleeve-meta .a{margin:.1rem 0 0;color:var(--ink-2);font-size:.85rem;line-height:1.3}
.tagline{margin:.3rem 0 0;font-size:.78rem;color:var(--ink-2)}
.tagline.wild{color:var(--ink);font-style:italic}
.play{display:inline-flex;align-items:center;gap:.35rem;margin-top:.5rem;align-self:flex-start;text-decoration:none;font-weight:600;font-size:.85rem;padding:.3rem .7rem .3rem .55rem;border-radius:999px;background:var(--ink);color:var(--paper)}
.play::before{content:"";width:0;height:0;border-left:.5rem solid currentColor;border-top:.32rem solid transparent;border-bottom:.32rem solid transparent}
.play:hover{background:var(--ink-2)}
.play.big{font-size:1rem;padding:.6rem 1.1rem .6rem .9rem}

.actions{position:sticky;bottom:0;z-index:5;background:var(--paper);display:flex;gap:.6rem;flex-wrap:wrap;align-items:center;padding:.9rem 0 calc(.9rem + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);margin-top:.5rem}
.btn{border:0;cursor:pointer;border-radius:999px;padding:.7rem 1.2rem;font-weight:600;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line)}
.btn.primary{background:var(--sun);color:var(--sun-ink);box-shadow:none}
.btn.primary:hover{filter:brightness(1.05)}
.btn.quiet{background:none;box-shadow:none;color:var(--ink-2);padding-inline:.6rem}
.btn:disabled{opacity:.5;cursor:default}

.below{display:grid;gap:2rem;margin-top:2rem}
@media (min-width:760px){.below{grid-template-columns:1fr 260px}}
.below h2,.page h2{font-family:var(--serif);font-weight:400;font-size:1.35rem;margin:0 0 .75rem}
.kept{list-style:none;margin:0;padding:0;display:grid;gap:.6rem}
.kept li{display:grid;grid-template-columns:48px 1fr auto;gap:.75rem;align-items:center}
.kept .mini{width:48px;height:48px;border-radius:2px;overflow:hidden;padding:0;border:0;cursor:pointer;background:none}
.kept .mini svg{display:block;width:100%;height:100%}
.kept p{margin:0;line-height:1.25}
.kept .a{color:var(--ink-2);font-size:.88rem}
.kept .play{margin:0}
.muted{color:var(--ink-2)}
.compass svg{width:100%;max-width:260px;height:auto;display:block}
.compass .lbl{font:500 10px var(--sans);fill:var(--ink-2)}
.compass .all{fill:var(--ink-2);opacity:.28}
.compass .cand{fill:var(--ink)}
.compass .liked{fill:var(--sun);stroke:var(--ink);stroke-width:1}
.compass .zone{fill:var(--sun-soft);stroke:var(--sun);stroke-width:1.5;transition:all .4s}
.compass .frame{fill:none;stroke:var(--line)}
.compass figcaption{font-size:.85rem;color:var(--ink-2);margin-top:.4rem;max-width:260px}

.empty{padding:2rem 0;max-width:34rem}

/* Library */
.page{padding-top:1.25rem}
.page-head{display:flex;flex-wrap:wrap;gap:.75rem;align-items:center;margin-bottom:1rem}
.page-head h1{font-family:var(--serif);font-weight:400;font-size:2rem;margin:0 auto 0 0}
.search{flex:1 1 220px;max-width:340px;padding:.6rem .9rem;border-radius:999px;border:1px solid var(--line);background:var(--surface)}
select{padding:.55rem .8rem;border-radius:999px;border:1px solid var(--line);background:var(--surface)}
.chips{display:flex;gap:.4rem;flex-wrap:wrap;margin-bottom:1.25rem}
.chip{border:1px solid var(--line);background:none;border-radius:999px;padding:.3rem .75rem;cursor:pointer;font-size:.88rem;color:var(--ink-2)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.grid{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:1.25rem 1rem}
.grid button{all:unset;cursor:pointer;display:block;width:100%}
.grid button:focus-visible{outline:3px solid var(--sun);outline-offset:3px}
.grid svg{display:block;width:100%;aspect-ratio:1;border-radius:3px;box-shadow:var(--lift)}
.grid .t{margin:.55rem 0 0;font-weight:600;font-size:.92rem;line-height:1.25}
.grid .a{margin:.1rem 0 0;color:var(--ink-2);font-size:.84rem}
.count{color:var(--ink-2);font-size:.9rem;margin:-.5rem 0 1rem}

/* Sheet */
.scrim{position:fixed;inset:0;background:rgba(10,14,26,.5);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.scrim[hidden]{display:none}
.sheet{background:var(--paper);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:16px 16px 0 0;padding:1.25rem 1.25rem calc(1.5rem + env(safe-area-inset-bottom,0px));animation:up .25s ease-out}
@media (min-width:640px){.scrim{align-items:center}.sheet{border-radius:16px}}
@keyframes up{from{transform:translateY(24px);opacity:0}}
.sheet-top{display:grid;grid-template-columns:140px 1fr;gap:1.1rem;align-items:end}
.sheet-top svg{width:140px;height:140px;border-radius:3px;box-shadow:var(--lift);display:block}
.sheet h2{font-family:var(--serif);font-weight:400;font-size:1.6rem;line-height:1.1;margin:0}
.sheet .a{color:var(--ink-2);margin:.3rem 0 0}
.bars{margin:1.4rem 0;display:grid;gap:.7rem}
.bar{display:grid;grid-template-columns:5.5rem 1fr 5.5rem;gap:.6rem;align-items:center;font-size:.85rem;color:var(--ink-2)}
.bar span:last-child{text-align:right}
.track{height:6px;border-radius:3px;background:var(--line);position:relative}
.track i{position:absolute;top:50%;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;background:var(--ink)}
.sheet-actions{display:flex;flex-wrap:wrap;gap:.6rem;align-items:center}
.close{float:right;margin:-.25rem -.25rem 0 0}

/* History & notes */
.hist{list-style:none;margin:0;padding:0;display:grid;gap:.8rem;max-width:40rem}
.hist li{display:grid;grid-template-columns:52px 1fr auto;gap:.8rem;align-items:center}
.hist svg{width:52px;height:52px;border-radius:2px;display:block}
.hist p{margin:0;line-height:1.3}
.hist .when{color:var(--ink-2);font-size:.85rem;text-align:right}
.stats{display:flex;gap:2rem;flex-wrap:wrap;margin:0 0 1.5rem}
.stats p{margin:0}
.stats b{display:block;font-family:var(--serif);font-weight:400;font-size:1.9rem;line-height:1}
.stats span{color:var(--ink-2);font-size:.88rem}
.prose{max-width:40rem}
.prose h2{margin-top:2.25rem}
.prose p,.prose li{line-height:1.6}
.prose code{font-size:.9em;background:var(--surface);padding:.05rem .3rem;border-radius:3px;box-shadow:inset 0 0 0 1px var(--line)}
pre{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:1rem;font-size:.82rem;line-height:1.5}
.tune{display:grid;gap:1.1rem;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:1.1rem 1.2rem;max-width:40rem}
.tune label{display:grid;gap:.3rem;font-weight:500}
.tune .row{display:flex;align-items:center;gap:.75rem}
.tune input[type=range]{flex:1;accent-color:var(--sun)}
.tune .val{min-width:6.5rem;color:var(--ink-2);font-weight:400;font-size:.92rem}
.tune .check-row{display:flex;gap:.6rem;align-items:center;font-weight:500}
.tune input[type=checkbox]{width:1.1rem;height:1.1rem;accent-color:var(--sun)}
.tune small{color:var(--ink-2);font-weight:400}

.toast{position:fixed;left:50%;bottom:calc(5.5rem + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:.65rem 1.1rem;border-radius:999px;font-weight:500;z-index:30;max-width:90vw;text-align:center;animation:up .2s ease-out}
.toast[hidden]{display:none}

@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

<main id="app"></main>

<div class="toast" id="toast" role="status" hidden></div>

<script>
/* ==========================================================================
   Side A: prototype. Sections:
   1. Utilities          4. Persistence (Store)
   2. Data + adapter     5. Recommender (pure-ish, testable)
   3. Covers             6. UI: views, sheet, routing
   ========================================================================== */

/* ---------- 1. Utilities ---------- */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function hashStr(s){let h=2166136261;for(const c of s){h^=c.charCodeAt(0);h=Math.imul(h,16777619)}return h>>>0}
const clamp01 = v => Math.max(0, Math.min(1, v));
const dist = (a, b) => Math.sqrt(a.reduce((s, v, i) => s + (v - b[i]) ** 2, 0));
const mean = vs => vs[0].map((_, i) => vs.reduce((s, v) => s + v[i], 0) / vs.length);
const lerp = (a, b, t) => a.map((v, i) => v + (b[i] - v) * t);
const DAY = 864e5;

/* ---------- 2. Data + adapter ----------
   Every album carries a 4-number mood vector, each 0..1:
   energy (calm → lively), brightness (dark → bright),
   organic (electronic → acoustic), density (spare → lush).
   These are hand-tagged sample values. */
const DIMS = [
  {key:'energy',     lo:'Calm',       hi:'Lively'},
  {key:'brightness', lo:'Dark',       hi:'Bright'},
  {key:'organic',    lo:'Electronic', hi:'Acoustic'},
  {key:'density',    lo:'Spare',      hi:'Lush'},
];
const RAW = `Kind of Blue|Miles Davis|1959|Jazz|.30|.45|.90|.40
In a Silent Way|Miles Davis|1969|Jazz|.35|.40|.60|.50
A Love Supreme|John Coltrane|1965|Jazz|.60|.50|.90|.75
Blue Train|John Coltrane|1958|Jazz|.60|.60|.90|.60
Moanin’|Art Blakey & the Jazz Messengers|1959|Jazz|.70|.70|.90|.60
Waltz for Debby|Bill Evans Trio|1962|Jazz|.25|.55|.95|.35
Journey in Satchidananda|Alice Coltrane|1971|Jazz|.35|.50|.85|.60
Getz/Gilberto|Stan Getz & João Gilberto|1964|Jazz|.25|.80|.95|.30
Promises|Floating Points, Pharoah Sanders & LSO|2021|Jazz|.20|.45|.75|.50
Kid A|Radiohead|2000|Alternative|.45|.25|.30|.70
In Rainbows|Radiohead|2007|Alternative|.50|.50|.55|.60

Funeral|Arcade Fire|2004|Alternative|.75|.55|.75|.80
Ágætis byrjun|Sigur Rós|1999|Alternative|.35|.50|.55|.75
Blue|Joni Mitchell|1971|Folk|.25|.45|.95|.30
Pink Moon|Nick Drake|1972|Folk|.15|.35|1|.15
Carrie & Lowell|Sufjan Stevens|2015|Folk|.15|.25|.90|.25
For Emma, Forever Ago|Bon Iver|2007|Folk|.20|.30|.85|.30
Fleet Foxes|Fleet Foxes|2008|Folk|.45|.70|.95|.60
Dragon New Warm Mountain I Believe in You|Big Thief|2022|Folk|.45|.55|.85|.50
Discovery|Daft Punk|2001|Electronic|.85|.90|.10|.65
Random Access Memories|Daft Punk|2013|Electronic|.65|.80|.50|.70
Music Has the Right to Children|Boards of Canada|1998|Electronic|.35|.45|.15|.50
Selected Ambient Works 85–92|Aphex Twin|1992|Electronic|.45|.50|.10|.45
Immunity|Jon Hopkins|2013|Electronic|.65|.50|.15|.70
Since I Left You|The Avalanches|2000|Electronic|.75|.90|.40|.85
Sound of Silver|LCD Soundsystem|2007|Electronic|.80|.60|.25|.70
Swim|Caribou|2010|Electronic|.70|.65|.15|.65
Untrue|Burial|2007|Electronic|.50|.10|.05|.60
Rounds|Four Tet|2003|Electronic|.50|.65|.45|.60
Black Sands|Bonobo|2010|Electronic|.50|.60|.45|.55
Moon Safari|Air|1998|Electronic|.35|.75|.30|.45
Rumours|Fleetwood Mac|1977|Rock|.60|.65|.70|.55
Abbey Road|The Beatles|1969|Rock|.60|.70|.75|.60
Pet Sounds|The Beach Boys|1966|Rock|.50|.75|.75|.80
Remain in Light|Talking Heads|1980|Rock|.85|.65|.45|.85

Disintegration|The Cure|1989|Rock|.50|.15|.35|.85
Loveless|My Bloody Valentine|1991|Rock|.70|.40|.30|1
Heaven or Las Vegas|Cocteau Twins|1990|Rock|.50|.70|.30|.80
Teen Dream|Beach House|2010|Rock|.40|.55|.40|.70
Currents|Tame Impala|2015|Rock|.60|.65|.25|.75
Con Todo El Mundo|Khruangbin|2018|Rock|.50|.70|.85|.40
Mezzanine|Massive Attack|1998|Trip-hop|.50|.10|.25|.70
Dummy|Portishead|1994|Trip-hop|.35|.15|.35|.55
What’s Going On|Marvin Gaye|1971|Soul|.50|.60|.80|.65
Songs in the Key of Life|Stevie Wonder|1976|Soul|.70|.85|.70|.80
Voodoo|D’Angelo|2000|Soul|.45|.50|.75|.65
Blonde|Frank Ocean|2016|Soul|.30|.40|.50|.45

Madvillainy|Madvillain|2004|Hip-hop|.60|.45|.45|.75

Donuts|J Dilla|2006|Hip-hop|.60|.60|.50|.70

Tabula Rasa|Arvo Pärt|1984|Classical|.10|.30|.90|.30
The Blue Notebooks|Max Richter|2004|Classical|.20|.25|.75|.35
Spaces|Nils Frahm|2013|Classical|.40|.50|.60|.50
Glassworks|Philip Glass|1982|Classical|.50|.50|.70|.60
Goldberg Variations (1981)|Glenn Gould|1982|Classical|.40|.60|1|.50
Buena Vista Social Club|Buena Vista Social Club|1997|World|.50|.80|1|.50
In the Heart of the Moon|Ali Farka Touré & Toumani Diabaté|2005|World|.35|.65|1|.40
Éthiopiques Vol. 4|Mulatu Astatke|1998|World|.55|.60|.90|.55
Expensive Shit|Fela Kuti|1975|World|.90|.70|.85|.75`;

/* LibraryAdapter contract (what a TidalLibrary must also implement):
     name: string
     listAlbums(): Promise<Album[]>   Album = {id, title, artist, year, genre, f:[4], addedAt, tidalId, coverUrl?}
     playLink(album): string          URL that opens the album in Tidal                       */
const MockLibrary = {
  name: 'Sample collection',
  async listAlbums(){
    return RAW.trim().split('\n').map(line => {
      const p = line.split('|');
      const id = 'a' + hashStr(p[1] + '/' + p[0]).toString(36);
      const rng = mulberry32(hashStr(id));
      return {id, title:p[0], artist:p[1], year:+p[2], genre:p[3], f:p.slice(4).map(Number),
              addedAt: Date.now() - Math.floor(rng() * 1200) * DAY, tidalId:null, coverUrl:null};
    });
  },
  playLink(a){
    // Real ids → album page; sample data has none, so fall back to a Tidal search.
    return a.tidalId ? `https://tidal.com/browse/album/${a.tidalId}`
                     : `https://listen.tidal.com/search?q=${encodeURIComponent(a.artist + ' ' + a.title)}`;
  }
};

/* ---------- 3. Covers ----------
   Placeholder sleeves generated from each album’s mood vector, so the
   pictures themselves hint at the feel: hue and lightness follow
   brightness, round vs. angular shapes follow organic, count follows
   density, scatter and tilt follow energy. Replaced by coverUrl later. */
const coverCache = new Map();
function cover(a){
  if (coverCache.has(a.id)) return coverCache.get(a.id);
  const [e, b, o, d] = a.f, rng = mulberry32(hashStr(a.id + 'c'));
  const hue = Math.round(228 - b * 190 + (rng() - .5) * 30);
  const L = Math.round(16 + b * 58), S = Math.round(30 + e * 40);
  const bg = `hsl(${hue} ${S}% ${L}%)`;
  const fgHue = (hue + 140 + rng() * 80) % 360;
  const fg = `hsl(${fgHue} ${55 + e*30}% ${L > 52 ? 24 : 82}%)`;
  const fg2 = `hsl(${(fgHue + 40) % 360} 60% ${L > 52 ? 40 : 64}%)`;
  const n = 2 + Math.round(d * 12);
  let shapes = '';
  for (let i = 0; i < n; i++){
    const x = 50 + (rng() - .5) * (30 + e * 70), y = 50 + (rng() - .5) * (30 + e * 70);
    const col = rng() < .6 ? fg : fg2, op = (.35 + rng() * .55).toFixed(2);
    const size = (6 + rng() * 30) * (1.15 - d * .5);
    if (rng() < o){
      shapes += rng() < .5
        ? `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${size.toFixed(1)}" fill="${col}" opacity="${op}"/>`
        : `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${size.toFixed(1)}" fill="none" stroke="${col}" stroke-width="${(1 + e*3).toFixed(1)}" opacity="${op}"/>`;
    } else {
      const rot = Math.round((rng() - .5) * 180 * e);
      shapes += `<rect x="${(x - size/2).toFixed(1)}" y="${(y - size/4).toFixed(1)}" width="${size.toFixed(1)}" height="${(size/2 * (rng()*.8+.2)).toFixed(1)}" fill="${col}" opacity="${op}" transform="rotate(${rot} ${x.toFixed(1)} ${y.toFixed(1)})"/>`;
    }
  }
  const svg = `<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="${esc(a.title)} cover"><rect width="100" height="100" fill="${bg}"/>${shapes}</svg>`;
  coverCache.set(a.id, svg);
  return svg;
}

/* ---------- 4. Persistence ----------
   Plays, sessions and tuning settings. Saved to this browser right away,
   and to the artifact’s private per-person store when the viewer offers one. */
const DEFAULT_STATE = () => ({v:1, plays:[], sessions:[], settings:{avoidDays:7, shrink:.62, wildcard:true, math:false}});
const Store = {
  key: 'side-a:v1', state: DEFAULT_STATE(), remote: null, writing: false, dirty: false,
  load(){
    try { const raw = localStorage.getItem(this.key); if (raw) this.state = this.merge(JSON.parse(raw)); } catch {}
    this.connect();
    return this.state;
  },
  merge(s){ const d = DEFAULT_STATE(); return {...d, ...s, settings:{...d.settings, ...(s && s.settings)}}; },
  save(){
    try { localStorage.setItem(this.key, JSON.stringify(this.state)); } catch {}
    this.dirty = true; this.flush();
  },
  async flush(){
    if (!this.remote || this.writing || !this.dirty) return;
    this.writing = true; this.dirty = false;
    try { await this.remote.set(JSON.parse(JSON.stringify(this.state))); } catch {}
    this.writing = false;
    if (this.dirty) this.flush();
  },
  async connect(){
    if (!window.claude || !window.claude.use) return;
    try {
      const [db, user] = await Promise.all([claude.use('db'), claude.use('user')]);
      if (!db || !user) return;
      const uid = await user.id(); if (!uid) return;
      const ref = db.doc('data/users/' + uid + '/state');
      const snap = await ref.get();
      if (snap.exists && snap.data() && (snap.data().plays || []).length >= this.state.plays.length){
        this.state = this.merge(snap.data());
        try { localStorage.setItem(this.key, JSON.stringify(this.state)); } catch {}
        route();
      }
      this.remote = ref; this.dirty = true; this.flush();
    } catch {}
  }
};

/* ---------- 5. Recommender ----------
   A session keeps a guess of today’s mood (target vector) and how sure
   it is (sigma, the radius of the search). Each round:
   - Picked albums pull the target toward their average.
   - Unpicked albums push it slightly away, and their close neighbours
     are damped for the rest of the session.
   - Sigma shrinks after a round with picks, and widens after a round
     with none, so “none of these” means look elsewhere.
   Candidates are drawn by weighted sampling around the target, spread
   apart so the five aren’t near-duplicates. Early rounds swap one slot
   for a wildcard from outside the zone, in case the guess is wrong. */
const Rec = {
  recentIds(){
    const cut = Date.now() - App.store.settings.avoidDays * DAY;
    return new Set(App.store.plays.filter(p => p.at > cut).map(p => p.id));
  },
  pool(s){
    const recent = this.recentIds();
    let pool = App.albums.filter(a => !s.seen.has(a.id) && !recent.has(a.id));
    if (pool.length < 5) pool = App.albums.filter(a => !s.seen.has(a.id));
    return pool;
  },
  fit(a, s){
    if (!s.target) return null;
    const d = dist(a.f, s.target);
    let w = Math.exp(-(d*d) / (2 * s.sigma * s.sigma));
    for (const pid of s.passed){
      const dp = dist(a.f, App.byId.get(pid).f);
      w *= 1 - .5 * Math.exp(-(dp*dp) / (2 * .08 * .08));
    }
    return w;
  },
  diverse(pool, rng, n){
    const rest = [...pool], out = [rest.splice(Math.floor(rng() * rest.length), 1)[0]];
    while (out.length < n && rest.length){
      let best = -1, bi = 0;
      rest.forEach((a, i) => { const m = Math.min(...out.map(o => dist(o.f, a.f))) + rng() * .25; if (m > best){ best = m; bi = i; } });
      out.push(rest.splice(bi, 1)[0]);
    }
    return out.map(a => ({id:a.id, wildcard:false, fit:null}));
  },
  focused(pool, s){
    const wantWild = App.store.settings.wildcard && s.round <= 3;
    const nFocus = wantWild ? 4 : 5;
    const cand = pool.map(a => ({a, w: this.fit(a, s)}));
    const out = [];
    for (let k = 0; k < nFocus && cand.length; k++){
      const total = cand.reduce((t, c) => t + c.w, 0);
      let idx = 0;
      if (total <= 1e-9){
        idx = cand.reduce((bi, c, i) => dist(c.a.f, s.target) < dist(cand[bi].a.f, s.target) ? i : bi, 0);
      } else {
        let r = s.rng() * total;
        for (; idx < cand.length - 1; idx++){ r -= cand[idx].w; if (r <= 0) break; }
      }
      const [c] = cand.splice(idx, 1);
      out.push({id:c.a.id, wildcard:false, fit:this.fit(c.a, s)});
      cand.forEach(o => { const d = dist(o.a.f, c.a.f); o.w *= 1 - .7 * Math.exp(-(d*d) / (2 * .1 * .1)); });
    }
    if (wantWild && cand.length){
      const far = cand.filter(c => dist(c.a.f, s.target) > s.sigma * 1.5);
      const src = far.length ? far : cand;
      const c = src[Math.floor(s.rng() * src.length)];
      out.splice(Math.floor(s.rng() * (out.length + 1)), 0, {id:c.a.id, wildcard:true, fit:this.fit(c.a, s)});
    }
    return out;
  },
  draw(s){
    const pool = this.pool(s);
    if (!pool.length) return [];
    const picks = s.target ? this.focused(pool, s) : this.diverse(pool, s.rng, 5);
    picks.forEach(p => s.seen.add(p.id));
    return picks;
  },
  newSession(seed){
    const s = {round:1, target: seed ? [...seed.f] : null, sigma: seed ? .22 : .5, liked:[], passed:[],
               seen:new Set(), current:[], selected:new Set(), rng:mulberry32((Date.now() ^ 0x9e3779b9) >>> 0),
               startedAt:Date.now(), seedId: seed ? seed.id : null};
    if (seed) s.seen.add(seed.id);
    s.current = this.draw(s);
    return s;
  },
  advance(s){
    const picked = s.current.filter(c => s.selected.has(c.id)).map(c => App.byId.get(c.id));
    const passed = s.current.filter(c => !s.selected.has(c.id)).map(c => App.byId.get(c.id));
    if (picked.length){
      const pv = mean(picked.map(a => a.f));
      s.target = s.target ? lerp(s.target, pv, .6) : pv;
      if (passed.length){
        const pm = mean(passed.map(a => a.f));
        s.target = s.target.map((v, i) => clamp01(v + .12 * (v - pm[i])));
      }
      s.sigma = Math.max(.1, s.sigma * App.store.settings.shrink);
    } else if (s.target){
      s.sigma = Math.min(.6, s.sigma * 1.35);
    }
    s.liked.push(...picked.map(a => a.id));
    s.passed.push(...passed.map(a => a.id));
    s.selected = new Set(); s.round++;
    s.current = this.draw(s);
  },
  words(t){
    const [e, b, o, d] = t, w = [];
    w.push(e < .38 ? 'calm' : e > .62 ? 'lively' : 'steady');
    w.push(b < .38 ? 'dark' : b > .62 ? 'bright' : 'mellow');
    if (o > .62) w.push('acoustic'); else if (o < .38) w.push('electronic');
    if (d > .66) w.push('lush'); else if (d < .34) w.push('spare');
    return w.length > 1 ? w.slice(0, -1).join(', ') + ' and ' + w[w.length - 1] : w[0];
  },
  confidence(s){ return s.sigma > .3 ? 'Still guessing' : s.sigma > .17 ? 'Getting warmer' : 'Zeroing in'; }
};

/* Morning view */
function renderMorning(){
  const s = App.session ||= Rec.newSession();
  const date = new Date().toLocaleDateString(undefined, {weekday:'long', day:'numeric', month:'long'});
  const seed = s.seedId ? App.byId.get(s.seedId) : null;
  let lead;
  if (s.round === 1 && !seed) lead = 'Five from your collection, as different as they come. Tap the ones that suit how you feel, then ask for more.';
  else lead = `Reading you as ${Rec.words(s.target || [.5,.5,.5,.5])}.` + (seed && s.round === 1 ? ` Starting near ${seed.title}.` : '');
  const n = s.selected.size;
  const math = App.store.settings.math;

  const cards = s.current.map((c, i) => {
    const a = App.byId.get(c.id), picked = s.selected.has(c.id);
    const tilt = ((mulberry32(hashStr(c.id + s.round))() - .5) * 7).toFixed(1);
    let tag = '';
    if (c.wildcard) tag = `<p class="tagline wild">Wildcard</p>`;
    if (math) tag += `<p class="tagline">${c.fit == null ? 'spread pick' : 'fit ' + Math.round(c.fit * 100) + '%'}, ${a.f.map(v => v.toFixed(2)).join(' ')}</p>`;
    return `<li class="sleeve${picked ? ' is-picked' : ''}" style="--tilt:${tilt}deg">
      <button class="sleeve-art" data-action="toggle" data-id="${a.id}" aria-pressed="${picked}" aria-label="${esc(a.title)} by ${esc(a.artist)}: ${picked ? 'fits my mood' : 'tap if it fits your mood'}">${cover(a)}<span class="check" aria-hidden="true">✓</span></button>
      <div class="sleeve-meta"><p class="t">${esc(a.title)}</p><p class="a">${esc(a.artist)}, ${a.year}</p>${tag}</div>
      ${playLink(a, 'morning')}
    </li>`;
  }).join('');

  const kept = s.liked.map(id => App.byId.get(id));
  const keptHtml = kept.length
    ? `<ul class="kept">${kept.map(a => `<li><button class="mini" data-action="detail" data-id="${a.id}" aria-label="Details for ${esc(a.title)}">${cover(a)}</button><div><p>${esc(a.title)}</p><p class="a">${esc(a.artist)}</p></div>${playLink(a, 'morning')}</li>`).join('')}</ul>`
    : `<p class="muted">Albums you tap are kept here across rounds, so you can go back to one.</p>`;

  const body = s.current.length ? `
    <ol class="table" aria-label="Round ${s.round} albums">${cards}</ol>
    <div class="actions">
      <button class="btn primary" data-action="next">${n ? `Show 5 more like ${n === 1 ? 'this' : 'these'}` : 'None fit, show different ones'}</button>
      <button class="btn quiet" data-action="restart">Start over</button>
    </div>` : `
    <div class="empty"><p>You’ve seen every album that fits this session. Start over to reshuffle, or pick from the ones you kept below.</p>
    <button class="btn primary" data-action="restart">Start over</button></div>`;

  $('#app').innerHTML = `
    <section class="hello">
      <h1>${greet()}.</h1>
      <p class="date">${esc(date)}</p>
    </section>
    <div class="round-line"><strong>Round ${s.round}</strong>${s.target ? `<span>${Rec.confidence(s)}</span>` : ''}</div>
    <p class="reading">${esc(lead)}</p>
    ${body}
    <div class="below">
      <section><h2>Kept so far</h2>${keptHtml}</section>
      <figure class="compass" style="margin:0"><h2>Today’s mood</h2>${compass(s)}
        <figcaption>${s.target ? 'The shaded zone is where the next five come from. Gold dots are albums you kept.' : 'After your first picks, a zone appears showing where Side A is looking.'}</figcaption></figure>
    </div>`;
}

function compass(s){
  const W = 220, P = 22, span = W - 2 * P;
  const X = v => (P + v * span).toFixed(1), Y = v => (W - P - v * span).toFixed(1);
  const all = App.albums.map(a => `<circle class="all" cx="${X(a.f[0])}" cy="${Y(a.f[1])}" r="2"/>`).join('');
  const cand = s.current.map(c => { const a = App.byId.get(c.id); return `<circle class="cand" cx="${X(a.f[0])}" cy="${Y(a.f[1])}" r="3.2"/>`; }).join('');
  const liked = s.liked.map(id => { const a = App.byId.get(id); return `<circle class="liked" cx="${X(a.f[0])}" cy="${Y(a.f[1])}" r="4.2"/>`; }).join('');
  const zone = s.target ? `<circle class="zone" cx="${X(s.target[0])}" cy="${Y(s.target[1])}" r="${(s.sigma * span).toFixed(1)}"/>` : '';
  return `<svg viewBox="0 0 ${W} ${W}" role="img" aria-label="Mood map: energy across, brightness up">
    <defs><clipPath id="cp"><rect x="${P}" y="${P}" width="${span}" height="${span}"/></clipPath></defs>
    <rect class="frame" x="${P}" y="${P}" width="${span}" height="${span}" rx="4"/>
    <g clip-path="url(#cp)">${zone}</g>${all}${cand}${liked}
    <text class="lbl" x="${P}" y="${W - 6}">calm</text>
    <text class="lbl" x="${W - P}" y="${W - 6}" text-anchor="end">lively</text>
    <text class="lbl" x="4" y="${P + 8}">bright</text>
    <text class="lbl" x="4" y="${W - P - 2}">dark</text>
  </svg>`;
}

function updateGrid(){

    <h2>What each album knows</h2>

    <h2>How a round is picked</h2>
    <p>Round one is chosen for spread: five albums as far apart on those four axes as possible, with some randomness. From then on the app keeps a target point and a search radius. Albums you tap pull the target toward their average; the ones you leave push it slightly away and damp their close neighbours for the rest of the session. A round with picks shrinks the radius; a round with none widens it. Each new five is sampled around the target, spread apart so they aren’t near-copies, and early rounds keep one wildcard from outside the zone in case the guess went wrong.</p>

    <h2>What’s real and what’s mocked</h2>
    <p>The flow, the recommender, history and tuning all work. The collection, the mood numbers and the covers are samples. Play opens a Tidal search for the album because the sample albums have no Tidal ids; with real ids it opens the album page directly.</p>

    <p>The script is split into the modules a repo would have: <code>data</code> (adapter), <code>covers</code>, <code>store</code>, <code>recommender</code> and <code>ui</code>. The recommender only reads album vectors and play history, so it can be unit-tested on its own. To connect Tidal, write a second adapter with the same three members:</p>
<pre>const TidalLibrary = {
  name: 'Your Tidal collection',
  async listAlbums() {

    // 2. Page through the user’s favourite albums

  }
};</pre>
    <p>The open question is where the mood numbers come from. Options, roughly from least to most effort: tag albums from genre and descriptive metadata with a one-off Claude pass and let you correct them; average track-level audio attributes if the Tidal API exposes them (check their current docs); or learn them over time from which albums you pick together. Whichever you choose, cache the vectors by album id so the recommender stays fast and offline.</p>
    <p>Persistence today is your browser plus this page’s private store. In the repo, swap <code>Store</code> for a small backend table of plays and sessions keyed by your Tidal user.</p>
  </section>`;
}
function shrinkLabel(v){ return v < .55 ? 'Fast' : v < .7 ? 'Moderate' : 'Slow'; }

/* Detail sheet */
function openDetail(id){
  const a = App.byId.get(id);
  const plays = App.store.plays.filter(p => p.id === id);
  $('#sheet').innerHTML = `
    <button class="btn quiet close" data-action="close" aria-label="Close">Close</button>
    <div class="sheet-top">${cover(a)}<div><h2>${esc(a.title)}</h2><p class="a">${esc(a.artist)}, ${a.year}<br>${esc(a.genre)}</p></div></div>
    <div class="bars">${DIMS.map((d, i) => `<div class="bar"><span>${d.lo}</span><span class="track"><i style="left:${a.f[i] * 100}%"></i></span><span>${d.hi}</span></div>`).join('')}</div>
    <p class="muted" style="margin:0 0 1.2rem">${plays.length ? `Played ${plays.length} time${plays.length > 1 ? 's' : ''}, last on ${new Date(plays[0].at).toLocaleDateString(undefined, {day:'numeric', month:'long'})}.` : 'Not played from Side A yet.'}</p>
    <div class="sheet-actions">${playLink(a, 'sheet')}<button class="btn" data-action="seed" data-id="${a.id}">Start a session near this</button></div>`;
  $('#scrim').hidden = false;
  $('#sheet .close').focus();
}
function closeDetail(){ $('#scrim').hidden = true; }

/* Events */
document.addEventListener('click', e => {
  const play = e.target.closest('[data-play]');
  if (play){
    const src = play.dataset.source === 'morning' ? 'morning' : 'library';
    closeDetail(); logPlay(play.dataset.play, src); return;
  }
  if (e.target === $('#scrim')) { closeDetail(); return; }
  const el = e.target.closest('[data-action]'); if (!el) return;
  const act = el.dataset.action, s = App.session;
  if (act === 'toggle'){
    s.selected.has(el.dataset.id) ? s.selected.delete(el.dataset.id) : s.selected.add(el.dataset.id);
    renderMorning(); $(`[data-action="toggle"][data-id="${el.dataset.id}"]`)?.focus();
  } else if (act === 'next'){
    Rec.advance(s); renderMorning(); $('.table')?.scrollIntoView({behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block:'nearest'});
  } else if (act === 'restart'){
    App.session = Rec.newSession(); renderMorning(); window.scrollTo(0, 0);
  } else if (act === 'detail'){
    openDetail(el.dataset.id);
  } else if (act === 'close'){
    closeDetail();
  } else if (act === 'seed'){
    closeDetail(); App.session = Rec.newSession(App.byId.get(el.dataset.id));
    if (location.hash === '#morning') renderMorning(); else location.hash = 'morning';
    window.scrollTo(0, 0);
  } else if (act === 'genre'){
    App.lib_genre = el.dataset.genre;
    document.querySelectorAll('.chip').forEach(c => c.setAttribute('aria-pressed', c.dataset.genre === App.lib_genre));
    updateGrid();
  } else if (act === 'clear'){
    if (!App.clearArmed){ App.clearArmed = true; renderHistory(); setTimeout(() => { App.clearArmed = false; if (location.hash === '#history') renderHistory(); }, 4000); }
    else { const settings = App.store.settings; App.store.plays = []; App.store.sessions = []; App.store.settings = settings; App.clearArmed = false; Store.save(); renderHistory(); toast('History cleared'); }
  }
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset.input === 'q'){ App.lib_q = t.value; updateGrid(); }
  if (t.dataset.input === 'sort'){ App.lib_sort = t.value; updateGrid(); }
  if (t.dataset.setting){
    const k = t.dataset.setting, st = App.store.settings;
    st[k] = t.type === 'checkbox' ? t.checked : +t.value;
    if (k === 'avoidDays') $('#v-avoidDays').textContent = st[k] + ' days';
    if (k === 'shrink') $('#v-shrink').textContent = shrinkLabel(st[k]);
    Store.save();
  }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('#scrim').hidden) closeDetail(); });

/* Routing */
const VIEWS = {morning: renderMorning, library: renderLibrary, history: renderHistory, how: renderHow};
function route(){
  const name = VIEWS[location.hash.slice(1)] ? location.hash.slice(1) : 'morning';
  document.querySelectorAll('.nav a').forEach(a => {
    if (a.getAttribute('href') === '#' + name) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current');
  });
  VIEWS[name]();
}
window.addEventListener('hashchange', () => { route(); window.scrollTo(0, 0); });

(async function boot(){
  Store.load();
  Object.defineProperty(App, 'store', {get: () => Store.state, configurable: true});
  App.albums = await App.lib.listAlbums();
  App.albums.forEach(a => App.byId.set(a.id, a));
  route();
})();
</script>
</body>
</html>
